<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>אוסף — שיעורי אמונה עם הרב בן ציון אוריאל</title>
<meta name="theme-color" content="#F7F3EA">
<link rel="icon" href="/cover/kuzari.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Hebrew:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<a class="skip" href="#works">דילוג לרשימת החיבורים</a>

<div class="wrap" style="padding-top:16px">
  <a class="back" href="/">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
    כל הסדרות
  </a>
</div>

<header class="wrap s-head">
  <img class="cover" id="cover" src="" alt="" width="128" height="128">
  <div style="flex:1 1 340px; min-width:0">
    <h1 id="name">…</h1>
    <p class="card-meta" id="meta"></p>
    <p class="card-meta" id="note"></p>
    <div class="actions" id="actions"></div>
  </div>
</header>

<main class="wrap" id="works">
  <h2 class="section-h">החיבורים שבאוסף</h2>
  <ul class="grid" id="grid"></ul>
</main>

<script>
const fmt = new Intl.NumberFormat('he-IL');
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const slug = (location.pathname.match(/\/c\/([a-z0-9-]+)/) || [])[1] || '';

fetch('/data/index.json').then(r => r.json()).then(ix => {
  const c = ix.find(x => x.slug === slug && x.kind === 'collection');
  if (!c) { location.replace('/'); return; }

  document.title = `${c.name} — שיעורי אמונה`;
  document.getElementById('name').textContent = c.name;
  // 🚨 ה-slug של האוסף זהה לזה של החיבור הראשון (הפיד נשאר עליו), ולכן
  //    לאוסף יש עטיפה בשם נפרד — אחרת «כתבי רמח"ל» היה מציג «קל"ח פתחים».
  document.getElementById('cover').src = `/cover/col-${c.slug}.jpg`;
  document.getElementById('meta').textContent =
    `${fmt.format(c.works.length)} חיבורים · ${fmt.format(c.count)} שיעורים · ${fmt.format(c.hours)} שעות לימוד`;
  document.getElementById('note').textContent =
    'כל חיבור נלמד מתחילתו ועד סופו, וכל אחד מהם הוא פודקאסט בפני עצמו — אפשר להירשם רק למה שרוצים ללמוד.';

  document.getElementById('grid').innerHTML = c.works.map(w => `
    <li class="card">
      <a class="card-link" href="/s/${w.slug}">
        <img class="cover" src="/cover/${w.slug}.jpg" alt="" width="96" height="96" loading="lazy">
        <div class="card-body">
          <h3>${esc(w.name)}</h3>
          <p class="card-meta">${fmt.format(w.count)} שיעורים · ${fmt.format(w.hours)} שעות</p>
          <ul class="parts"><li>פודקאסט בפני עצמו</li></ul>
        </div>
      </a>
    </li>`).join('');
});
</script>
<script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
